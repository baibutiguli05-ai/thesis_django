<div class="actions">
    <form method="post" action="{{ action }}">{% csrf_token %}<input type="hidden" name="decision" value="approved">
        <button class="btn btn-success btn-sm" {% if disabled %}disabled title="CS квотасы толды"{% endif %}><i class="fa-solid fa-check"></i>Бекіту</button></form>
    <form method="post" action="{{ action }}" data-confirm="Қабылдамауға сенімдісіз бе?">{% csrf_token %}<input type="hidden" name="decision" value="rejected">
        <button class="btn btn-danger btn-sm" title="Қабылдамау"><i class="fa-solid fa-xmark"></i></button></form>
</div>
